<!DOCTYPE html>
<html>
    <head>
        <title>Test form</title>
    </head>

    <style>
        .container{
            background-color: black;
            margin: 10px;
            padding: 10px;
        }
    </style>
    <script>
        function calSum(){
            const fnum = document.getElementById("fnum").value;
            const snum = document.getElementById('snum').value;
            const element = document.getElementById("finalSum")
            
            element.innerHTML = parseInt(fnum) + parseInt(snum);
        }
    </script>
    <body>
            <input id="fnum" placeholder="number 1" type="text" class="container">
            <br><br>
            <input id="snum" placeholder="number 2" type="text" class="container">
            <br><br>
            <button onclick="{calSum()}">Calculate sum</button>
            <br><br>
            <div id="finalSum"></div>
    </body>
</html>
