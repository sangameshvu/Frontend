
<!DOCTYPE html>
<hhtml>
    <head>
        <title>Test form</title>
    </head>
    <script>
        function debounceCalSum(){
            let timeout;
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                calSum()
            }, 100);

        }
        async function calSum(){
            const a = document.getElementById("a").value;

            const b = document.getElementById("b").value;
            const sum = await fetch(
                 `http://localhost:3000/sum?a=${a}&b=${b}`
            )
            const data = await sum.json()
            console.log(data)
            document.getElementById("result").innerHTML = data.result
        }
    </script>
    <body>
        <input id="a" placeholder="1st number" oninput="debounceCalSum()">
        <br><br>
        <input id="b" placeholder="2nd number" oninput="debounceCalSum()">
        <br><br>
        <p id="result"></p>
    </body>
</hhtml>
